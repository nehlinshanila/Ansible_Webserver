---
- name: Deploy webserver
  hosts: webservers
  become: false

  tasks:
    - name: Create web directory
      file:
        path: ~/webserver
        state: directory
        mode: '0755'
      tags: deploy

    - name: Create index.html
      copy:
        dest: ~/webserver/index.html
        content: |
          <html>
          <head>
              <title>Web Server</title>
          </head>
          <body>
              <h1>Hello World from SJSU-{{ '1' if inventory_hostname == '192.168.64.6' else '2' }}</h1>
          </body>
          </html>
      tags: deploy

    - name: Start webserver on port 8080
      shell: |
        pkill -f '[p]ython3 [m] http.server 8080' || true
        nohup python3 -m http.server 8080 --directory ~/webserver > ~/webserver/server.log 2>&1 &
      tags: deploy

    - name: Stop webserver
      shell: |
        pkill -f '[p]ython3 [m] http.server 8080' || true
      tags: undeploy
